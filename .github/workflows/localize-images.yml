name: Localize portfolio images
on:
  push:
    branches: [seo/images]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow beautifulsoup4
      - run: python3 tools/localize_images.py
      - run: python3 tools/build_hu.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add img/p index.html hu/index.html
          git diff --cached --quiet || git commit -m "Move portfolio images from Google Drive into the site"
          git push
