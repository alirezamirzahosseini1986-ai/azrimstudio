<script>
(function(){
  if (/[?&]stay\b/.test(location.search)) return;
  var ok=["en", "hu", "de", "ar", "fa"], pick=null;
  try{ pick=localStorage.getItem("ap-lang"); }catch(e){}
  if(ok.indexOf(pick)<0){ var ls=(navigator.languages||[navigator.language||"en"]);
    for(var i=0;i<ls.length&&!pick;i++){ var c=(ls[i]||"").slice(0,2).toLowerCase(); if(ok.indexOf(c)>-1) pick=c; } }
  location.replace((pick||"en")+"/");
})();
</script>
